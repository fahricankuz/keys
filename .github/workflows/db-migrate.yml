name: Veritabanı migration

# Supabase veritabanına supabase/migrations altındaki yeni migration'ları uygular.
# YALNIZCA ELLE çalışır (Actions → Veritabanı migration → Run workflow); hiçbir push bunu tetiklemez.
# Site dağıtımından ayrıdır: önce seçilen ortamda migration başarılı olur, sonra site dağıtılır.
#
# Doğrudan Postgres bağlantısıyla çalışır (`--db-url`); `supabase link`, Supabase erişim jetonu ve
# Management API yetkisi GEREKMEZ.
#
# Her GitHub environment'ında (Settings → Environments → staging / production):
#   Secret   SUPABASE_DB_URL   Supabase → Connect → "Session pooler" bağlantı adresi (parola içinde;
#                              özel karakterler URL-kodlu). GitHub sunucularında IPv6 olmadığından
#                              "Direct connection" değil, Session pooler (port 5432) kullan.
#   Variable SUPABASE_TARGET   environment'ın adı (staging / production). Secret yalnız depo düzeyindeyse
#                              yanlış veritabanına gitmeyi önler; eşleşmezse iş bağlanmadan durur.
# production'a "Required reviewers" eklemen önerilir. Ayrıntı: docs/migrations.md

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Hedef GitHub environment (önce staging)'
        type: environment
        default: staging
      mode:
        description: 'İşlem'
        type: choice
        default: plan
        options:
          - plan
          - adopt-existing-baseline
          - apply

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) Playwright 1.49 bağımlılıklarını kuramıyor
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET: ${{ vars.SUPABASE_TARGET }}
      ENV_NAME: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      # Sürüm sabit: "latest" CLI'ın yeni ana sürümüne (3.x) kendiliğinden geçip davranışı değiştirebilir.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: schema.sql migration'larla uyumlu mu
        run: node scripts/db-derle.mjs --kontrol
      - name: Ortam ve bağlantı adresini denetle (değer yazdırmaz)
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }
          [ "$TARGET" = "$ENV_NAME" ] || err "Environment '$ENV_NAME' içinde SUPABASE_TARGET değişkeni '$ENV_NAME' değil. Settings → Environments → $ENV_NAME → Variables'a ekle; SUPABASE_DB_URL secret'ını da bu environment'a koy."
          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            "") err "SUPABASE_DB_URL boş (bu environment'ta tanımlı değil)." ;;
            *) err "SUPABASE_DB_URL postgresql:// ile başlamalı (Supabase → Connect → Session pooler)." ;;
          esac
          case "$DB_URL" in *"[YOUR-PASSWORD]"*) err "SUPABASE_DB_URL içindeki [YOUR-PASSWORD] yerine gerçek parolayı yaz." ;; esac
          exit $fail
      - name: Başlangıçta uygulanmış ve bekleyen migration'lar
        run: supabase migration list --db-url "$DB_URL"
      # Yalnızca okur. Şemalı ama kayıtsız veritabanında apply'ı, şemasız veritabanında adopt'u durdurur.
      - name: Güvenlik denetimi (yazmaz)
        id: denetim
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          bash scripts/db-preflight.sh "${{ inputs.mode }}"
      # Yalnızca baseline şeması zaten kurulu MEVCUT veritabanı için. Geçmişe kayıt düşer; şema oluşturmaz.
      - name: Mevcut baseline'ı bir kez kaydet
        if: ${{ inputs.mode == 'adopt-existing-baseline' && steps.denetim.outputs.baseline_kayitli != 'true' }}
        run: supabase migration repair --db-url "$DB_URL" --status applied 20261101000000
      - name: Plan (veritabanına yazmaz)
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: supabase db push --db-url "$DB_URL" --dry-run
      - name: Bekleyen migration'ları uygula
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push --db-url "$DB_URL" --yes
      - name: İşlem sonrasında migration durumu
        if: ${{ inputs.mode != 'plan' }}
        run: supabase migration list --db-url "$DB_URL"
