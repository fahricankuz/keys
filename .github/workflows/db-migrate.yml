name: Veritabanı migration

# Supabase veritabanına supabase/migrations altındaki yeni migration'ları uygular.
# YALNIZCA ELLE çalışır (Actions → Veritabanı migration → Run workflow); hiçbir push bunu tetiklemez.
# Varsayılan "dry_run" açıktır: neyin uygulanacağını gösterir, veritabanına dokunmaz. Gerçek uygulama için işareti kaldır.
#
# Gerekli (Settings → Environments → production → Secrets; ortama "Required reviewers" eklemen önerilir):
#   SUPABASE_ACCESS_TOKEN  Supabase → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   projenin veritabanı parolası
#   SUPABASE_PROJECT_REF   proje kimliği (adresteki xxxx.supabase.co başındaki xxxx)
# Ayrıntı: docs/migrations.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Yalnızca göster, uygulama (önerilen ilk adım)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: schema.sql migration'larla uyumlu mu
        run: node scripts/db-derle.mjs --kontrol
      - name: Projeye bağlan
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Uygulanmış ve bekleyen migration'lar
        run: supabase migration list
      - name: Uygula (dry run değilse)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            supabase db push --dry-run
          else
            supabase db push
          fi
