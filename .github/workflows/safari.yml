name: Safari denemesi

# Safari (WebKit, iPhone 14) ile "@mobil" etiketli testler: iPhone'a özgü sorunları (düzen, fotoğraf, dosya seçici) yakalamak için.
# Yayını engellemez ve yayını geciktirmez (ayrı iş akışı, continue-on-error); sonuç Actions'ta görünür.
# Sürekli yeşil görününce hostinger.yml içindeki `needs` listesine alınıp engelleyici yapılabilir.

# Dakika tasarrufu: yalnız PR'da çalışır (eskiden her push'ta da çalışıp aynı değişiklik için iki kez dakika harcıyordu); belge değişikliği çalıştırmaz.
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: safari-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safari:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) Playwright 1.49 bağımlılıklarını kuramıyor
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=safari
        env:
          WEBKIT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: safari-raporu
          path: test-results/
          retention-days: 7
