name: Hostinger paketi

# Hostinger için hazır site paketini üretir:
#  1) `site` dalına yalnızca derlenmiş siteyi yazar (Hostinger'ın Git özelliği bu dalı public_html'e çeker),
#     varsayılan dala gelen her değişiklikte bu dal yeniden derlenip güncellenir,
#  2) aynı dosyaları `anahtar-hostinger.zip` olarak indirilebilir paket (artifact) bırakır.
# Varsayılan dala her push'ta ve elle (Actions → Hostinger paketi → Run workflow) çalışır.
# Değişkenler pages.yml ile aynıdır: SUPABASE_URL (boşsa projenin adresi kullanılır), SUPABASE_ANON_KEY (boşsa projenin herkese açık "publishable" anahtarı kullanılır; gizli/secret anahtar asla girilmez),
# TURNSTILE_SITE_KEY (isteğe bağlı).
on:
  push:
  workflow_dispatch:
    inputs:
      testleri_atla:
        description: 'Acil durum: testleri çalıştırmadan paketle (normalde kapalı bırakın)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  # Yayın testlere bağlıdır: testler geçmezse site paketi üretilmez, `site` dalı güncellenmez.
  test:
    if: (github.event_name == 'workflow_dispatch' && !inputs.testleri_atla) || (github.event_name != 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Paketleri kur
        working-directory: app
        run: npm ci
      - name: Tür denetimi
        working-directory: app
        run: npx tsc --noEmit
      - name: Supabase anahtarı denetimi
        env:
          ANON: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_7FOuGjt9lHI94rQI9iWHZA_KpSmfh-N' }}
        run: |
          if [ -z "$ANON" ]; then
            echo "::warning title=Supabase anahtarı yok::SUPABASE_ANON_KEY tanımlı değil; site yerel hesap modunda (veri yalnız tarayıcıda) derleniyor. Settings → Secrets and variables → Actions → Variables altına ekleyin."
          fi
      - name: Siteyi derle ve sertleştir
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nfpefnrgtnwvclwbriaw.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_7FOuGjt9lHI94rQI9iWHZA_KpSmfh-N' }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build:hostinger
      - name: Zip paketi
        run: |
          cd hostinger-site
          zip -qr ../anahtar-hostinger.zip . -x '.git/*'
          ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: anahtar-hostinger
          path: anahtar-hostinger.zip
          retention-days: 30
      - name: site dalına yaz (Hostinger Git dağıtımı bu dalı çeker)
        run: |
          cd hostinger-site
          # Hostinger'ın "GitHub'dan içe aktar" (Node.js) sihirbazı package.json ister:
          # Framework Other, derleme `npm run build`, çıktı `dist`. Bağımlılık yok; site dosyaları dist/'e kopyalanır.
          cat > package.json <<'JSON'
          {
            "name": "anahtar-site",
            "version": "1.0.0",
            "private": true,
            "description": "anahtar: derlenmiş statik site. Derleme çıktısı: dist/",
            "scripts": { "build": "node build.mjs" },
            "engines": { "node": ">=18" }
          }
          JSON
          cat > build.mjs <<'JS'
          // Site dosyalarını (.htaccess dahil) dist/ klasörüne kopyalar; package.json ve build.mjs hariç.
          import { cpSync, readdirSync, rmSync } from 'node:fs';
          const skip = new Set(['dist', 'node_modules', '.git', 'package.json', 'package-lock.json', 'build.mjs']);
          rmSync('dist', { recursive: true, force: true });
          for (const f of readdirSync('.')) if (!skip.has(f)) cpSync(f, `dist/${f}`, { recursive: true });
          console.log('Site hazır: dist/');
          JS
          git init -q -b site
          git config user.name "anahtar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site derlemesi ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
