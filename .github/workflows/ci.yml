name: Testler

# Dakika tasarrufu (GitHub Actions kotası): testler yalnız PR'da (ve Hostinger paketi içinde, varsayılan dala giren değişiklikte) çalışır.
# Eskiden her push hem `push` hem `pull_request` ile iki kez çalışıyor, ayrıca `site` dalına yazılan derleme çıktısında da boşuna testler koşuyordu.
# (paths-ignore yok: "Testler (tam set)" ana dalda zorunlu kontrol; belge PR'ında da raporlanmalı, yoksa PR birleşmez.)
on:
  pull_request:
  # Hostinger paketi (yayın) bu iş akışını çağırır: testler geçmeden site yayına çıkmaz.
  workflow_call:

# Aynı PR'a yeni gönderim gelince eski test turu iptal edilir (yarım kalan tur dakika yemesin).
# Yayın (workflow_call) içinden çağrıldığında grup o çalışmaya özeldir; yayın testleri iptal edilmez.
concurrency:
  group: testler-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Test seti iki paralel parçada çalışır: tek süreçte 700+ test sunucunun belleğini tüketip işi "runner shutdown" ile
  # kesiyordu (ana dalda üç kez aynı noktada). Her parça yarı sürede biter, yarı bellek kullanır.
  parca:
    name: Testler (parça ${{ matrix.parca }}/2)
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) Playwright 1.49 bağımlılıklarını kuramıyor
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app
      # Tarayıcı önbellekten gelir (Playwright sürümü değişince yeniden indirilir).
      - name: Playwright sürümü
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install chromium
      # Sistem paketleri yalnız tarayıcı açılamazsa kurulur: ubuntu-24.04 imajında Chromium kütüphaneleri hazır gelir;
      # "--with-deps" her seferinde testlerde gerekmeyen yazı tiplerini (CJK, Tay) Ubuntu deposundan indiriyordu (5–9 dk).
      - name: Tarayıcı açılıyor mu (gerekirse sistem paketleri)
        run: |
          if ! timeout 60 node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium açılamadı; sistem paketleri kuruluyor."
            npx playwright install-deps chromium
          fi
      # Tutanak belgesi testi PDF'in metnini ve sayfa sayısını okur (pdftotext, pdfinfo); küçük paket, yazı tipi içermez.
      - name: PDF araçları (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: npx playwright test --shard=${{ matrix.parca }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-raporu-${{ matrix.parca }}
          path: test-results/
          retention-days: 7

  # Görünen ad zorunlu kontroldür (ana dal koruması): iki parça da geçtiyse yeşil. PR'da atlanan yayın işiyle ("test") karışmasın diye ayrı ad.
  test:
    name: Testler (tam set)
    needs: parca
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: İki parça da geçti mi
        run: |
          echo "Parçaların sonucu: ${{ needs.parca.result }}"
          [ "${{ needs.parca.result }}" = "success" ]
