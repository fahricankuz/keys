name: Fonksiyonları yayınla

# Supabase Edge Function'larını (supabase/functions altındakiler) Supabase'e yükler.
# YALNIZCA ELLE çalışır (Actions → Fonksiyonları yayınla → Run workflow); hiçbir push bunu tetiklemez.
# Önce veritabanı migration'ı (Actions → Veritabanı migration), sonra bu iş, sonra Hostinger'da site güncellemesi.
#
# Gerekli (Settings → Secrets and variables → Actions, ya da ilgili environment'ta):
#   Secret  SUPABASE_ACCESS_TOKEN  Supabase → Account → Access Tokens. Fonksiyon yüklemek için "Create legacy token" (tam yetkili) gerekir.
#   Secret ya da Variable  SUPABASE_PROJECT_REF  proje kimliği (Project Settings → General → Reference ID)
# Fonksiyonların gizli değerleri (RESEND_API_KEY, EMAIL_FROM, LEAD_SECRET, MAIL_SECRET, WEBHOOK_SECRET …) Supabase → Edge Functions → Secrets'ta durur;
# bu iş onlara dokunmaz. Her fonksiyonun JWT ayarı supabase/config.toml'dan gelir. Ayrıntı: docs/eposta.md

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Hedef GitHub environment'
        type: environment
        default: production
      functions:
        description: 'Hangi fonksiyonlar: hepsi, ya da boşlukla ayrılmış adlar (ör. lead-mail mail-send)'
        type: string
        default: hepsi

permissions:
  contents: read

concurrency:
  group: functions-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      WANT: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Ayarları denetle (değer yazdırmaz)
        run: |
          fail=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN tanımlı değil (Supabase → Account → Access Tokens → Create legacy token)."; fail=1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::SUPABASE_PROJECT_REF tanımlı değil."; fail=1; }
          exit $fail
      - name: Yüklenecek fonksiyonlar
        id: list
        run: |
          if [ "$WANT" = "hepsi" ] || [ -z "$WANT" ]; then
            names=$(for d in supabase/functions/*/; do [ -f "$d/index.ts" ] && basename "$d"; done | tr '\n' ' ')
          else
            names="$WANT"
          fi
          for n in $names; do
            case "$n" in *[!a-z0-9-]*) echo "::error::Geçersiz fonksiyon adı: $n"; exit 1 ;; esac
            [ -f "supabase/functions/$n/index.ts" ] || { echo "::error::supabase/functions/$n/index.ts yok."; exit 1; }
          done
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Yüklenecek: $names"
      - name: Yükle
        run: |
          for n in ${{ steps.list.outputs.names }}; do
            echo "::group::$n"
            supabase functions deploy "$n" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
