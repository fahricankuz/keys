name: Güvenlik taraması

# Kod (Semgrep), gizli anahtar (gitleaks) ve bağımlılık (npm audit) taraması.
# Her gönderimde, her çekme isteğinde ve haftada bir çalışır.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  # Kod taraması: Semgrep (açık kaynak sürüm, gizli depoda ücretsiz). CodeQL gizli depoda ücretli "Code scanning" ister.
  # Bulgular bu işin logunda görünür; bulgu varsa iş kırmızı biter.
  semgrep:
    runs-on: ubuntu-24.04
    container: semgrep/semgrep:1.90.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (JavaScript / TypeScript kuralları)
        run: >-
          semgrep scan --config p/javascript --config p/typescript --metrics=off --error
          --exclude node_modules --exclude dist --exclude www --exclude hostinger/site --exclude android --exclude ios

  gizli-anahtar:
    runs-on: ubuntu-latest
    # Gizli depoda gitleaks PR'ın commit listesini okuyabilmek için pull-requests: read ister.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bagimlilik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kök paketler (yalnızca üretim bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high
      # zod açığı yalnızca Expo derleme aracında (@expo/cli); tarayıcıya giden pakete girmez.
      # Expo'nun kendi sürümüyle kapanır; o zamana dek yalnızca kritik açıklar derlemeyi durdurur.
      - name: Site paketleri
        working-directory: app
        run: npm audit --omit=dev --audit-level=critical
